[project]
name = "metagen"
version = "0.1.0"
description = "Profiles structured datasets and generates a versioned semantic catalog as grounding context for Gen AI apps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "meta-gen contributors" }]
dependencies = [
    "pydantic>=2.6",
    "pyarrow>=15",
    "pandas>=2.2",
    "numpy>=1.26",
    "rich>=13.7",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
    "textual>=0.60",
    "openpyxl>=3.1",
    # The TUI needs at least one LLM — ship both as base deps so the product
    # works out of the box and users don't have to learn `--extra` syntax.
    "anthropic>=0.39",
    "openai>=1.40",
]

[project.scripts]
metagen = "metagen.tui.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metagen"]

[tool.hatch.build.targets.wheel.force-include]
"src/metagen/schema/output_schema_v1.json" = "metagen/schema/output_schema_v1.json"
"examples" = "metagen/_examples"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["metagen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
